<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Activation du compte dans le programme Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #020617;
      --card: #020617;
      --accent: #facc15;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .page { max-width: 600px; width: 100%; }

    .card {
      background: #020617;
      border-radius: 24px;
      border: 1px solid rgba(148,163,184,0.25);
      padding: 24px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 10px; }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #020617;
      color: white;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #facc15, #eab308);
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .status, .warning {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      display: none;
    }

    .status { background: #111827; }
    .warning { background: rgba(220,38,38,0.2); }

  </style>
</head>

<body>
<div class="page">
  <div class="card">

    <h1>🎯 Activation du compte</h1>

    <p class="subtitle">
      Entrez votre ID 1xBet (10 chiffres, commence par <b>149</b>).
      Nous connecterons ensuite votre compte au Predictor.
    </p>

    <form id="form">
      <input id="id" placeholder="Ex: 1491234567">
      <button class="btn">Vérifier et connecter</button>
    </form>

    <div id="status" class="status"></div>

    <div id="warning" class="warning">
      ❌ Activation impossible<br><br>
      Votre solde est actuellement 0.<br>
      Pour activer le système, faites un dépôt minimum de <b>250 €</b>.<br><br>
      Ensuite, revenez et relancez la vérification.
    </div>

  </div>
</div>

<script>
const form = document.getElementById("form");
const input = document.getElementById("id");
const status = document.getElementById("status");
const warning = document.getElementById("warning");

form.addEventListener("submit", e => {
  e.preventDefault();

  const id = input.value.trim();

  if (!/^\d{10}$/.test(id)) {
    alert("ID invalide");
    return;
  }

  if (!id.startsWith("149")) {
    alert("L’ID doit commencer par 149");
    return;
  }

  status.style.display = "block";
  status.innerHTML = "Connexion au serveur 1xBet...";

  setTimeout(() => {
    status.innerHTML += "<br>Compte trouvé...";
  }, 1200);

  setTimeout(() => {
    status.innerHTML += "<br>Synchronisation Predictor...";
  }, 2400);

  setTimeout(() => {
    warning.style.display = "block";
  }, 3600);
});
</script>

</body>
</html>
